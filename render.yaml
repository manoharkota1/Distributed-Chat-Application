services:
  - type: web
    name: distributed-chat-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Distributed Chat Application
      - key: DEBUG
        value: "false"
      - key: MONGODB_URI
        sync: false # Prompts you for the value on Render UI
      - key: MONGODB_DATABASE
        value: chat_db
      - key: UPSTASH_REDIS_REST_URL
        sync: false # Prompts you for the value
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false # Prompts you for the value
      - key: JWT_SECRET_KEY
        generateValue: true # Generates a secure random secret key automatically!
      - key: COOKIE_SECURE
        value: "true"
      - key: BACKEND_CORS_ORIGINS
        value: '["http://localhost:3000"]' # We will update this with your Vercel URL once deployed
