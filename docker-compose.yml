services:
  backend-1:
    build: ./backend
    environment: &backend-environment
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-chat_db}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?Set UPSTASH_REDIS_REST_URL in .env}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?Set UPSTASH_REDIS_REST_TOKEN in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://localhost"]'
      DEBUG: "false"
    networks: [chat-network]

  backend-2:
    build: ./backend
    environment: *backend-environment
    networks: [chat-network]

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend-1, backend-2]
    networks: [chat-network]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost
      NEXT_PUBLIC_WS_URL: ws://localhost
    depends_on: [nginx]
    networks: [chat-network]

networks:
  chat-network:
    driver: bridge
