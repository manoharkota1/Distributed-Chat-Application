# ================================================================
# Docker Compose — Full Stack Orchestration
#
# Services:
#   - frontend    : Next.js (port 3000)
#   - backend-1   : FastAPI instance 1
#   - backend-2   : FastAPI instance 2 (horizontal scaling demo)
#   - postgres     : PostgreSQL 16
#   - redis        : Redis 7
#   - nginx        : Load balancer (port 80)
# ================================================================

version: '3.8'

services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: changeme_db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  # ── Backend Instance 1 ─────────────────────────────────────
  backend-1:
    build: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chat_db
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: changeme_db_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: docker_compose_secret_key_change_in_production
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://localhost"]'
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chat-network

  # ── Backend Instance 2 (Horizontal Scaling Demo) ───────────
  backend-2:
    build: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chat_db
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: changeme_db_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: docker_compose_secret_key_change_in_production
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://localhost"]'
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chat-network

  # ── Nginx Load Balancer ────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - chat-network

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost
      NEXT_PUBLIC_WS_URL: ws://localhost
    depends_on:
      - nginx
    networks:
      - chat-network

volumes:
  postgres_data:

networks:
  chat-network:
    driver: bridge
