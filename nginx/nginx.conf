# ================================================================
# Nginx Load Balancer Configuration
#
# Distributes incoming HTTP/WSS connections across multiple
# FastAPI instances. NO sticky sessions required — Redis Pub/Sub
# handles cross-instance message delivery.
# ================================================================

upstream backend {
    # Multiple FastAPI instances for horizontal scaling
    server backend-1:8000;
    server backend-2:8000;
}

server {
    listen 80;
    server_name localhost;

    # ── Health Check ─────────────────────────────────────────
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ── WebSocket Connections ────────────────────────────────
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── REST API ─────────────────────────────────────────────
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}
